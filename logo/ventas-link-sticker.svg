<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ventas Link">
  <style>
    .bolsa{transform-origin:256px 440px;animation:salto 2.4s cubic-bezier(.3,.7,.4,1) infinite}
    .asa{transform-origin:256px 190px;animation:asa 2.4s ease-in-out infinite}
    .a1{transform-origin:214px 330px;animation:giro1 2.4s ease-in-out infinite}
    .a2{transform-origin:298px 330px;animation:giro2 2.4s ease-in-out infinite}
    .punto{transform-origin:400px 112px;animation:pop 2.4s ease-in-out infinite}
    .chispa{transform-origin:112px 120px;animation:pop 2.4s ease-in-out .5s infinite}
    .sombra{transform-origin:256px 470px;animation:sombra 2.4s cubic-bezier(.3,.7,.4,1) infinite}
    @keyframes salto{0%,100%{transform:translateY(0) scale(1.04,.94)}30%{transform:translateY(-38px) scale(.96,1.05)}55%{transform:translateY(0) scale(1.05,.93)}70%{transform:translateY(-8px) scale(1,1)}85%{transform:translateY(0) scale(1.01,.99)}}
    @keyframes asa{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg)}55%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
    @keyframes giro1{0%,100%{transform:rotate(0)}35%{transform:rotate(-14deg)}60%{transform:rotate(8deg)}}
    @keyframes giro2{0%,100%{transform:rotate(0)}35%{transform:rotate(14deg)}60%{transform:rotate(-8deg)}}
    @keyframes pop{0%,100%{transform:scale(.6);opacity:.5}35%{transform:scale(1.25);opacity:1}60%{transform:scale(1)}}
    @keyframes sombra{0%,100%{transform:scaleX(1);opacity:.28}30%{transform:scaleX(.7);opacity:.14}55%{transform:scaleX(1.05);opacity:.3}}
    @media (prefers-reduced-motion:reduce){.bolsa,.asa,.a1,.a2,.punto,.chispa,.sombra{animation:none}}
  </style>
  <ellipse class="sombra" cx="256" cy="478" rx="130" ry="14" fill="#131313" opacity=".28"/>
  <g class="bolsa">
    <path class="asa" d="M184 190v-26a72 72 0 0 1 144 0v26" fill="none" stroke="#131313" stroke-width="26" stroke-linecap="round"/>
    <path d="M132 190h248a22 22 0 0 1 22 20l24 200a30 30 0 0 1-30 34H116a30 30 0 0 1-30-34l24-200a22 22 0 0 1 22-20z" fill="#131313"/>
    <g fill="none" stroke-width="20" stroke-linecap="round">
      <rect class="a1" x="148" y="298" width="132" height="64" rx="32" stroke="#e6ee4a" transform="rotate(-18 214 330)"/>
      <rect class="a2" x="232" y="298" width="132" height="64" rx="32" stroke="#ff7a1a" transform="rotate(-18 298 330)"/>
    </g>
  </g>
  <circle class="punto" cx="400" cy="112" r="16" fill="#ff7a1a"/>
  <path class="chispa" d="M112 92l8 22 22 8-22 8-8 22-8-22-22-8 22-8z" fill="#e6ee4a" stroke="#131313" stroke-width="5" stroke-linejoin="round"/>
</svg>
