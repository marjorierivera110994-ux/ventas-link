[build]
  command = "node publicar.mjs"
  publish = "dist"

# La página principal abre la app del vendedor
[[redirects]]
  from = "/"
  to = "/app-vendedor.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
