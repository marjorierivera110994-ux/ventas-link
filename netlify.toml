[build]
  command = "node publicar.mjs"
  publish = "dist"

# Enlace público de cada tienda: /t/nombre-de-la-tienda
[[redirects]]
  from = "/t/*"
  to = "/tienda-demo.html"
  status = 200

# La página principal abre la app del vendedor
[[redirects]]
  from = "/"
  to = "/app-vendedor.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
