<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda de demostración — Boutique Luna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --pistacho: #a5dc5b; --lima: #e6ee4a; --naranja: #ff7a1a; --tinta: #131313; --beige: #f4ecdb; --blanco: #fff;
    --texto-2: #5a5648; --verde-texto: #2f6a10; --wa: #25d366;
    --f-d: 'Bricolage Grotesque', monospace; --f-b: 'Instrument Sans', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: var(--f-b); color: var(--tinta); background: var(--beige); min-height: 100dvh; line-height: 1.45;
         background-image: radial-gradient(800px 360px at 10% -6%, color-mix(in oklab, var(--pistacho) 45%, transparent), transparent 62%),
                           radial-gradient(700px 320px at 95% 0, color-mix(in oklab, var(--lima) 40%, transparent), transparent 60%); }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; }
  .app { max-width: 460px; margin: 0 auto; padding: 14px 16px 120px; }
  h1, h2, h3, h4 { font-family: var(--f-d); letter-spacing: -.015em; }

  .top { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .demo { display: flex; gap: 8px; align-items: center; background: var(--tinta); color: var(--lima); border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 700; min-height: 44px; }
  .region { min-height: 44px; border-radius: 999px; background: var(--blanco); padding: 0 14px; font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; box-shadow: 0 6px 16px -10px rgb(40 60 40 / .5); }
  .cab { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .logo { width: 52px; height: 52px; border-radius: 999px; background: var(--pistacho); display: grid; place-items: center; font-family: var(--f-d); font-weight: 800; font-size: 19px; flex-shrink: 0; }
  .cab h1 { font-size: 22px; font-weight: 800; line-height: 1.1; }
  .abierto { font-size: 12px; font-weight: 700; color: var(--verde-texto); }
  .desc { margin-top: 10px; font-size: 14px; color: var(--texto-2); }
  .buscar { margin-top: 12px; display: flex; align-items: center; gap: 8px; background: var(--blanco); border-radius: 999px; padding: 0 16px; min-height: 48px; box-shadow: 0 8px 20px -12px rgb(40 60 40 / .45); }
  .buscar input { border: 0; background: none; flex: 1; min-width: 0; height: 46px; font-size: 16px; }
  .buscar input:focus-visible { outline: none; }
  .buscar:focus-within { outline: 3px solid var(--tinta); outline-offset: 2px; }
  .cats { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; padding-bottom: 4px; }
  .chip { min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--blanco); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--tinta); color: var(--blanco); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .prod { background: var(--blanco); border-radius: 22px; padding: 10px; box-shadow: 0 12px 26px -16px rgb(40 60 40 / .5); display: flex; flex-direction: column; }
  .foto { height: 108px; border-radius: 16px; display: grid; place-items: center; position: relative; }
  .agotado { position: absolute; top: 8px; left: 8px; background: var(--tinta); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .prod h3 { margin-top: 9px; font-size: 15px; font-weight: 800; line-height: 1.2; }
  .prod .meta { font-size: 12px; color: var(--texto-2); margin-top: 2px; }
  .fila { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; padding-top: 8px; }
  .precio { font-weight: 800; font-size: 16px; font-family: var(--f-d); }
  .mas { width: 44px; height: 44px; border-radius: 999px; background: var(--lima); display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); flex-shrink: 0; }
  .mas[disabled] { background: #e4e0d4; cursor: not-allowed; }
  .sec-t { margin-top: 24px; font-size: 19px; font-weight: 800; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .sec-n { font-family: var(--f-b); font-size: 12px; font-weight: 600; color: var(--texto-2); }
  .seccion:first-child .sec-t { margin-top: 18px; }
  .precio-box { display: flex; flex-direction: column; line-height: 1.1; }
  .antes { font-size: 12px; font-weight: 500; color: #6f6a5d; text-decoration: line-through; }
  .precio.oferta-p { color: var(--tinta); }
  .oferta { position: absolute; top: 8px; right: 8px; background: var(--naranja); color: var(--tinta); font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
  .vacio { grid-column: 1 / -1; text-align: center; padding: 30px 10px; color: var(--texto-2); }
  .pie { margin-top: 22px; font-size: 12px; color: var(--texto-2); text-align: center; }

  .barra { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); display: none; justify-content: center; z-index: 5; pointer-events: none; }
  .barra.on { display: flex; }
  .barra button { pointer-events: auto; width: 100%; max-width: 428px; min-height: 58px; border-radius: 999px; background: var(--tinta); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 20px; font-weight: 700; box-shadow: 0 18px 34px -12px rgb(19 19 19 / .6); }
  .barra .cuenta { display: flex; align-items: center; gap: 10px; }
  .badge { background: var(--naranja); color: var(--tinta); min-width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; font-weight: 800; }
  .barra .ver { background: var(--lima); color: var(--tinta); border-radius: 999px; padding: 12px 18px; font-weight: 800; }

  .fondo { position: fixed; inset: 0; background: rgb(19 19 19 / .5); display: none; z-index: 10; align-items: flex-end; justify-content: center; }
  .fondo.on { display: flex; }
  .hoja { background: var(--beige); width: 100%; max-width: 460px; max-height: 92dvh; overflow-y: auto; border-radius: 28px 28px 0 0; padding: 18px 18px 26px; animation: sube .22s ease-out; }
  @keyframes sube { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
  .hoja-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hoja-cab h2 { font-size: 21px; font-weight: 800; }
  .cerrar { width: 44px; height: 44px; border-radius: 999px; background: var(--blanco); display: grid; place-items: center; flex-shrink: 0; }
  .linea { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; background: var(--blanco); border-radius: 18px; padding: 10px; margin-top: 10px; }
  .mini { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; }
  .linea h4 { font-size: 14px; font-weight: 800; }
  .linea p { font-size: 12px; color: var(--texto-2); }
  .cant { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
  .cant button { width: 44px; height: 44px; border-radius: 999px; background: var(--beige); display: grid; place-items: center; font-weight: 800; font-size: 18px; }
  .cant span { min-width: 24px; text-align: center; font-weight: 800; }
  .quitar { font-size: 12px; font-weight: 700; color: var(--texto-2); text-decoration: underline; min-height: 44px; padding: 0 6px; }
  .total { margin-top: 16px; background: var(--tinta); color: #fff; border-radius: 22px; padding: 16px; }
  .total div { display: flex; justify-content: space-between; font-size: 14px; }
  .total small { display: block; margin-top: 6px; font-size: 12px; color: #cfcabb; }
  .btn { margin-top: 14px; width: 100%; min-height: 54px; border-radius: 999px; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--tinta); color: var(--lima); }
  .btn.wa { background: var(--wa); color: var(--tinta); }
  .btn.claro { background: var(--blanco); color: var(--tinta); }
  .campo { margin-top: 14px; }
  .campo > label, .campo > legend { font-weight: 800; font-size: 14px; display: block; margin-bottom: 6px; font-family: var(--f-d); }
  .campo input[type=text], .campo textarea, .campo select { width: 100%; background: var(--blanco); border: 2px solid transparent; border-radius: 16px; padding: 12px 14px; min-height: 50px; font-size: 16px; }
  .campo input[type=text]:focus-visible, .campo textarea:focus-visible, .campo select:focus-visible { border-color: var(--tinta); outline: none; }
  .campo.err input, .campo.err textarea { border-color: #c2410c; }
  .error { color: #9a3412; font-size: 13px; font-weight: 700; margin-top: 4px; display: none; }
  .campo.err .error { display: block; }
  fieldset { border: 0; }
  .opciones { display: flex; flex-wrap: wrap; gap: 8px; }
  .opc { position: relative; }
  .opc input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  .opc span { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--blanco); font-weight: 700; font-size: 14px; border: 2px solid transparent; }
  .opc input:checked + span { background: var(--tinta); color: #fff; }
  .opc input:focus-visible + span { outline: 3px solid var(--naranja); outline-offset: 2px; }
  .aviso { margin-top: 12px; font-size: 13px; color: var(--texto-2); background: color-mix(in oklab, var(--lima) 45%, white); border-radius: 16px; padding: 10px 14px; }
  .vista-msg { white-space: pre-wrap; background: var(--blanco); border-radius: 16px; padding: 12px 14px; font-size: 13px; margin-top: 10px; max-height: 240px; overflow-y: auto; }
  .ok { width: 64px; height: 64px; border-radius: 999px; background: var(--pistacho); display: grid; place-items: center; margin: 6px auto 8px; }
  .centro { text-align: center; }
  .frase { font-weight: 800; font-family: var(--f-d); font-size: 19px; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--tinta); color: var(--lima); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 20; display: none; max-width: 90vw; }
  .toast.on { display: block; }
  @media (prefers-reduced-motion: reduce) { .hoja { animation: none; } }
</style>
</head>

  <div class="top">

  </div>

  <header class="cab">
    <span class="logo" aria-hidden="true">BL</span>
    <div><h1>Boutique Luna</h1><p class="abierto" data-i="abierto"></p></div>

  <p class="desc" data-i="desc"></p>

  <label class="buscar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

  <p class="pie" data-i="pie"></p>
</main>

      var num = el('span', { text: '1', 'aria-live': 'polite' });
      var menos = el('button', { type: 'button', 'aria-label': t('menos1'), text: '−', onclick: function () { cant = Math.max(1, cant - 1); num.textContent = cant; } });
      var masb = el('button', { type: 'button', 'aria-label': t('mas1'), text: '+', onclick: function () { var tope = Math.max(1, maxMas(p)); if (cant + 1 > maxMas(p) && p.stock !== null) toast(t('solo', { n: p.stock })); cant = Math.min(tope, cant + 1); num.textContent = cant; } });
      h.appendChild(el('div', { class: 'campo' }, [el('label', { text: t('cantidad') }), el('div', { class: 'cant' }, [menos, num, masb])]));
      h.appendChild(el('button', { type: 'button', class: 'btn', text: t('agregarPedido'), onclick: function () { var n = agregar(p.id, variante, cant); if (n) { cerrarHoja(); toast(t('agregado', { n: n, x: nm(p) })); } } }));
    });
  }

  function abrirCarrito() {
    abrirHoja(function (h) {
      h.appendChild(cabecera(t('miPedido')));
      var ls = lineas();
      if (!ls.length) {
        h.appendChild(el('p', { class: 'aviso', text: t('vacio') }));
        h.appendChild(el('button', { type: 'button', class: 'btn claro', text: t('verProductos'), onclick: cerrarHoja })); return;
      }
      ls.forEach(function (x) {
        var mini = el('div', { class: 'mini', style: 'background:' + x.p.color }); mini.innerHTML = svgHtml(x.p.arte, 32);
        var num = el('span', { text: String(x.l.cant) });
        var menos = el('button', { type: 'button', 'aria-label': t('menos1') + ': ' + nm(x.p), text: '−', onclick: function () { x.l.cant -= 1; if (x.l.cant <= 0) quitar(x.l); guardar(); pintarBarra(); abrirCarrito(); } });
        var masb = el('button', { type: 'button', 'aria-label': t('mas1') + ': ' + nm(x.p), text: '+', onclick: function () { if (maxMas(x.p) <= 0) { toast(t('solo', { n: x.p.stock })); return; } x.l.cant += 1; guardar(); pintarBarra(); abrirCarrito(); } });
        var qb = el('button', { type: 'button', class: 'quitar', text: t('quitar'), 'aria-label': t('quitar') + ': ' + nm(x.p), onclick: function () { quitar(x.l); guardar(); pintarBarra(); abrirCarrito(); } });
        h.appendChild(el('div', { class: 'linea' }, [mini,
          el('div', {}, [el('h4', { text: nm(x.p) }), el('p', { text: (x.l.variante ? etiquetaVar(x.p, x.l.variante) + ' · ' : '') + dinero(precioDe(x.p)) }), el('div', { class: 'cant' }, [menos, num, masb])]),
          el('div', { style: 'text-align:right' }, [el('strong', { text: dinero(x.total) }), el('br'), qb])]));
      });
      h.appendChild(el('div', { class: 'total' }, [el('div', {}, [el('span', { text: t('subtotal') }), el('span', { text: dinero(subtotal()) })]), el('small', { text: t('envioNota') })]));
      h.appendChild(el('button', { type: 'button', class: 'btn', text: t('continuar'), onclick: abrirEntrega }));
      h.appendChild(el('button', { type: 'button', class: 'btn claro', text: t('seguir'), onclick: cerrarHoja }));
    });
  }

  function abrirEntrega() {
    var d = estado.entrega || { nombre: '', modo: 'retiro', direccion: '', pago: pais().pagos[0], nota: '' };
    if (pais().pagos.indexOf(d.pago) < 0) d.pago = pais().pagos[0];
    abrirHoja(function (h) {
      h.appendChild(cabecera(t('coordina')));
      h.appendChild(el('p', { class: 'aviso', text: t('aviso') }));
      var nombre = el('input', { type: 'text', id: 'f-nombre', maxlength: '60', autocomplete: 'name', value: d.nombre, 'aria-describedby': 'e-nombre' });
      var cNombre = el('div', { class: 'campo' }, [el('label', { for: 'f-nombre', text: t('nombre') }), nombre, el('p', { class: 'error', id: 'e-nombre', text: t('nombreErr') })]);
      var dir = el('input', { type: 'text', id: 'f-dir', maxlength: '120', autocomplete: 'street-address', value: d.direccion, placeholder: t('dirPh'), 'aria-describedby': 'e-dir' });
      var cDir = el('div', { class: 'campo' }, [el('label', { for: 'f-dir', text: t('dir') }), dir, el('p', { class: 'error', id: 'e-dir', text: t('dirErr') })]);
      cDir.style.display = d.modo === 'domicilio' ? '' : 'none';
      function grupo(titulo, nombreG, opciones, actual, alCambiar) {
        var fs = el('fieldset', { class: 'campo' }, [el('legend', { text: titulo })]); var ops = el('div', { class: 'opciones' });
        opciones.forEach(function (o) {
          var r = el('input', { type: 'radio', name: nombreG, value: o[0], onchange: function () { alCambiar(o[0]); } }); if (o[0] === actual) r.checked = true;
          ops.appendChild(el('label', { class: 'opc' }, [r, el('span', { text: o[1] })]));
        }); fs.appendChild(ops); return fs;
      }
      var modo = d.modo, pago = d.pago;
      h.appendChild(cNombre);
      h.appendChild(grupo(t('como'), 'modo', [['retiro', t('retiro')], ['domicilio', t('domicilio')]], modo, function (o) { modo = o; cDir.style.display = o === 'domicilio' ? '' : 'none'; }));
      h.appendChild(cDir);
      h.appendChild(grupo(t('pago'), 'pago', pais().pagos.map(function (k) { return [k, etiquetaPago(k)]; }), pago, function (o) { pago = o; }));
      var nota = el('textarea', { id: 'f-nota', maxlength: '200', rows: '2', placeholder: t('notaPh') }); nota.value = d.nota;
      h.appendChild(el('div', { class: 'campo' }, [el('label', { for: 'f-nota', text: t('nota') }), nota]));
      h.appendChild(el('div', { class: 'total', style: 'margin-top:16px' }, [el('div', {}, [el('span', { text: cantidad() + ' ' + (cantidad() === 1 ? t('producto') : t('productos')) }), el('span', { text: dinero(subtotal()) })])]));
      var wa = el('button', { type: 'button', class: 'btn wa', onclick: function () {
        var ok = true;
        var n = nombre.value.trim(); cNombre.classList.toggle('err', !n); if (!n) ok = false;
        var dr = dir.value.trim(); var falta = modo === 'domicilio' && !dr; cDir.classList.toggle('err', falta); if (falta) ok = false;
        if (!ok) { (!n ? nombre : dir).focus(); return; }
        estado.entrega = { nombre: n, modo: modo, direccion: modo === 'domicilio' ? dr : '', pago: pago, nota: nota.value.trim() };
        enviar();
      } });
      wa.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#131313" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5Z"/></svg><span></span>';
      wa.lastChild.textContent = t('enviar');
      h.appendChild(wa);
      h.appendChild(el('button', { type: 'button', class: 'btn claro', text: t('volver'), onclick: abrirCarrito }));
    });
  }

  /* ---------- Mensaje de WhatsApp (amable y de cierre de venta) ---------- */
  function armarMensaje() {
    var e = estado.entrega; var m = [];
    m.push(t('m_hola', { negocio: NEGOCIO.nombre })); m.push('');
    lineas().forEach(function (x) {
      m.push('• ' + x.l.cant + ' x ' + nm(x.p) + (x.l.variante ? ' (' + etiquetaVar(x.p, x.l.variante) + ')' : '') + ' — ' + dinero(x.total));
    });
    m.push(''); m.push('*' + t('m_total') + ': ' + dinero(subtotal()) + '*'); m.push('');
    m.push('📍 ' + t('m_entrega') + ': ' + (e.modo === 'domicilio' ? t('domicilio') + ' — ' + e.direccion : t('retiro')));
    m.push('💳 ' + t('m_pago') + ': ' + etiquetaPago(e.pago));
    m.push('🙋 ' + t('m_nombre') + ': ' + e.nombre);
    if (e.nota) m.push('📝 ' + t('m_nota') + ': ' + e.nota);
    m.push(''); m.push(t('m_cierre'));
    return m.join('\n');
  }
  function enlaceWa(msg) { var num = String(NEGOCIO.whatsapp || '').replace(/\D/g, ''); return 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg); }
  function enviar() {
    var msg = armarMensaje(); var url = enlaceWa(msg);
    window.ultimoEnlaceWa = url;
    var w = window.open(url, '_blank', 'noopener');
    abrirHoja(function (h) {
      h.appendChild(cabecera(t('ultimo')));
      var ok = el('div', { class: 'ok' }); ok.innerHTML = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#131313" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>'; h.appendChild(ok);
      h.appendChild(el('p', { class: 'frase centro', text: t('listo') }));
      h.appendChild(el('p', { class: 'centro', style: 'margin-top:6px;color:var(--texto-2);font-size:14px', text: w ? t('okTxt') : t('bloqueado') }));
      if (!NEGOCIO.whatsapp) h.appendChild(el('p', { class: 'aviso', text: t('demoModo') }));
      h.appendChild(el('div', { class: 'vista-msg', text: msg }));
      var a = el('a', { class: 'btn wa', href: url, target: '_blank', rel: 'noopener', style: 'text-decoration:none' }); a.textContent = t('reabrir'); h.appendChild(a);
      h.appendChild(el('button', { type: 'button', class: 'btn claro', text: t('yaEnvie'), onclick: function () { estado.carrito = []; estado.entrega = null; guardar(); pintarBarra(); cerrarHoja(); toast(t('vaciado')); } }));
      h.appendChild(el('button', { type: 'button', class: 'btn claro', text: t('editar'), onclick: abrirCarrito }));
    });
  }

  $('q').addEventListener('input', function (e) { estado.q = e.target.value; pintarGrid(); });
  $('abrir-carrito').addEventListener('click', function (e) { abridor = e.currentTarget; abrirCarrito(); });
  $('region').addEventListener('click', function (e) { abridor = e.currentTarget; abrirAjustes(); });
  $('fondo').addEventListener('click', function (e) { if (e.target === $('fondo')) cerrarHoja(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('fondo').classList.contains('on')) cerrarHoja(); });

  aplicarIdioma();
  window.__tienda = { agregar: agregar, abrirCarrito: abrirCarrito, abrirEntrega: abrirEntrega, estado: estado, armarMensaje: armarMensaje, enlaceWa: enlaceWa, aplicarIdioma: aplicarIdioma, PAISES: PAISES };
})();
</script>
</body>
</html>
