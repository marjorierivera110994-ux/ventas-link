<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ventas Link — crea tu tienda (demostración)</title>
<link rel="icon" href="logo/ventas-link-icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root { --pistacho: #a5dc5b; --lima: #e6ee4a; --naranja: #ff7a1a; --tinta: #131313; --beige: #f4ecdb; --blanco: #fff; --texto-2: #5a5648; --verde-texto: #2f6a10; --wa: #25d366;
          --f-d: 'Bricolage Grotesque', monospace; --f-b: 'Instrument Sans', monospace; --ease: cubic-bezier(.16, 1, .3, 1); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: var(--f-b); color: var(--tinta); background: var(--beige); min-height: 100dvh; line-height: 1.45; overflow-x: hidden;
         background-image: radial-gradient(700px 360px at 0% -6%, color-mix(in oklab, var(--pistacho) 55%, transparent), transparent 62%),
                           radial-gradient(600px 300px at 100% 0, color-mix(in oklab, var(--lima) 45%, transparent), transparent 60%); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }
  h1, h2, h3 { font-family: var(--f-d); letter-spacing: -.02em; }
  h1 em, h2 em { font-style: normal; background: linear-gradient(transparent 58%, color-mix(in oklab, var(--lima) 85%, transparent) 58%); }

  .app { max-width: 440px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 20px; position: relative; }
  .tope { display: flex; align-items: center; gap: 12px; padding-top: max(14px, env(safe-area-inset-top)); min-height: 62px; }
  .atras, .cerrar { width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; flex-shrink: 0; background: color-mix(in oklab, var(--blanco) 80%, transparent); }
  .atras[hidden] { display: none; }
  .barra { flex: 1; height: 4px; border-radius: 999px; background: color-mix(in oklab, var(--tinta) 12%, transparent); overflow: hidden; }
  .barra i { display: block; height: 100%; width: 8%; border-radius: 999px; background: var(--tinta); transition: width .3s ease-out; }
  .pct { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; color: var(--texto-2); }
  .tope.oculto .barra, .tope.oculto .pct { visibility: hidden; }

  #escena { flex: 1; display: flex; flex-direction: column; position: relative; }
  .paso { flex: 1; display: flex; flex-direction: column; padding-bottom: 12px; }
  .paso h1 { font-size: clamp(28px, 8vw, 34px); line-height: 1.08; font-weight: 800; margin-top: 26px; text-wrap: balance; }
  .paso .sub { font-size: 15px; color: var(--texto-2); margin-top: 8px; }
  .paso .sub b { color: var(--tinta); font-weight: 600; }
  .cuerpo { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
  .pie { position: sticky; bottom: 0; margin: auto -20px 0; padding: 14px 20px max(16px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--beige) 28%); }

  .campo { display: block; }
  .campo label { font-weight: 700; font-size: 14px; display: block; margin-bottom: 6px; }
  .campo input, .campo select { width: 100%; min-height: 58px; border-radius: 18px; border: 2px solid transparent; background: var(--blanco); padding: 0 18px; font-size: 18px; box-shadow: 0 10px 24px -16px rgb(40 60 40 / .5); }
  .campo input:focus-visible, .campo select:focus-visible { border-color: var(--tinta); outline: none; }
  .campo.err input, .campo.err select { border-color: #c2410c; }
  .error { color: #9a3412; font-size: 14px; font-weight: 700; margin-top: 6px; display: none; }
  .campo.err .error { display: block; }
  .ayuda { font-size: 13px; color: var(--texto-2); margin-top: 6px; }
  .invita-banner { margin-top: 12px; background: var(--tinta); color: var(--lima); border-radius: 18px; padding: 12px 14px; font-weight: 700; font-size: 14px; }
  .pais-chip { display: flex; align-items: center; gap: 10px; background: color-mix(in oklab, var(--lima) 45%, white); border-radius: 18px; padding: 10px 14px; font-size: 14px; font-weight: 700; }
  .pais-chip small { display: block; font-weight: 500; color: var(--texto-2); font-size: 12.5px; }
  .tel-fila { display: grid; grid-template-columns: 132px 1fr; gap: 10px; }

  .opciones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .opc > span { min-width: 0; overflow-wrap: anywhere; }
  .opciones.uno { grid-template-columns: 1fr; }
  .opc { position: relative; min-height: 64px; border-radius: 18px; background: var(--blanco); border: 2px solid color-mix(in oklab, var(--tinta) 10%, transparent); padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; text-align: left; transition: transform .12s ease-out, border-color .15s, background .15s; }
  .opc:active { transform: scale(.97); }
  .opc .ic { width: 36px; height: 36px; border-radius: 12px; background: color-mix(in oklab, var(--pistacho) 55%, white); display: grid; place-items: center; flex-shrink: 0; }
  .opc .ck { margin-left: auto; width: 24px; height: 24px; border-radius: 999px; background: var(--tinta); color: var(--lima); display: grid; place-items: center; transform: scale(0); }
  .opc[aria-checked="true"] { border-color: var(--tinta); background: color-mix(in oklab, var(--lima) 40%, white); }
  .opc[aria-checked="true"] .ck { transform: scale(1); transition: transform .2s cubic-bezier(.34, 1.56, .64, 1); }
  .opc small { display: block; font-weight: 500; font-size: 13px; color: var(--texto-2); }
  .bloqueado .opc { pointer-events: none; }

  .btn { width: 100%; min-height: 58px; border-radius: 999px; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--tinta); color: var(--lima); box-shadow: 0 16px 28px -14px rgb(19 19 19 / .6); transition: transform .12s ease-out, opacity .2s; }
  .btn:active { transform: scale(.98); }
  .btn[disabled] { opacity: .45; box-shadow: none; cursor: not-allowed; }
  .btn.wa { background: var(--wa); color: var(--tinta); }
  .btn.claro { background: var(--blanco); color: var(--tinta); box-shadow: none; }
  .link { min-height: 44px; font-weight: 700; font-size: 14px; color: var(--texto-2); text-decoration: underline; text-underline-offset: 3px; display: inline-flex; align-items: center; justify-content: center; }
  .centro { text-align: center; }
  .pildora { display: inline-flex; align-items: center; gap: 8px; background: var(--tinta); color: var(--lima); border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 700; align-self: flex-start; }

  /* Bienvenida */
  .marca { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-family: var(--f-d); font-weight: 800; font-size: 18px; }
  .marca i { width: 40px; height: 40px; border-radius: 14px; background: var(--tinta); display: grid; place-items: center; }
  .lista-v { list-style: none; display: grid; gap: 12px; margin-top: 22px; }
  .lista-v li { display: flex; gap: 12px; align-items: flex-start; font-size: 16px; font-weight: 600; }
  .lista-v b { display: block; font-size: 16px; font-weight: 800; line-height: 1.2; }
  .lista-v small { display: block; font-size: 14px; font-weight: 500; color: var(--texto-2); margin-top: 1px; }
  .sticker { margin: 6px auto 0; width: 210px; height: 210px; position: relative; } .adorno { position: absolute; width: 46px; height: 46px; pointer-events: none; filter: drop-shadow(0 6px 6px rgb(20 40 10 / .22)); animation: flota 4s ease-in-out infinite; } .adorno.a1 { left: -34px; top: 18px; --r: -8deg; } .adorno.a2 { right: -36px; top: 70px; width: 50px; height: 50px; --r: 8deg; animation-delay: .8s; } .adorno.a3 { left: -26px; bottom: 36px; width: 38px; height: 38px; --r: -10deg; animation-delay: 1.5s; } @keyframes flota { 0%, 100% { transform: translateY(0) rotate(var(--r, -6deg)); } 50% { transform: translateY(-7px) rotate(calc(var(--r, -6deg) * -1)); } } @media (prefers-reduced-motion: reduce) { .adorno { animation: none; } } .sticker img { display: block; width: 100%; height: auto; }
  .mini-tienda { margin-top: 22px; background: var(--blanco); border-radius: 24px; padding: 10px; box-shadow: 0 22px 40px -22px rgb(40 60 40 / .55); position: relative; }
  .mini-tienda .mt-ban { background: var(--pistacho); border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 10px; font-family: var(--f-d); font-weight: 800; font-size: 16px; }
  .mini-tienda .mt-logo { width: 36px; height: 36px; border-radius: 999px; background: var(--blanco); display: grid; place-items: center; font-size: 13px; }
  .mini-tienda .mt-prods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .mini-tienda .mt-prods i { display: block; height: 46px; border-radius: 12px; }
  .mini-tienda .mt-prods i:nth-child(1) { background: var(--lima); } .mini-tienda .mt-prods i:nth-child(2) { background: var(--naranja); } .mini-tienda .mt-prods i:nth-child(3) { background: color-mix(in oklab, var(--pistacho) 70%, white); }
  .mini-tienda .mt-wa { position: absolute; right: -6px; bottom: -14px; background: var(--wa); border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; box-shadow: 0 10px 18px -8px rgb(37 211 102 / .7); }
  .lista-v .ic { width: 38px; height: 38px; border-radius: 12px; background: color-mix(in oklab, var(--pistacho) 60%, white); display: grid; place-items: center; flex-shrink: 0; }

  /* Armando tu tienda */
  .anillo { position: relative; width: 132px; height: 132px; margin: 34px auto 0; }
  .anillo svg { transform: rotate(-90deg); display: block; }
  .anillo .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-d); font-weight: 800; font-size: 30px; font-variant-numeric: tabular-nums; }
  .lineas { list-style: none; display: grid; gap: 14px; margin-top: 30px; }
  .lineas li { display: flex; gap: 12px; align-items: center; font-size: 16px; font-weight: 600; opacity: 0; transform: translateY(8px); transition: opacity .25s ease-out, transform .25s ease-out, color .2s; }
  .lineas li.ver { opacity: .45; transform: none; }
  .lineas li.act { opacity: 1; }
  .lineas li.hecha { opacity: 1; }
  .lineas .pt { width: 24px; height: 24px; border-radius: 999px; flex-shrink: 0; display: grid; place-items: center; border: 2px solid color-mix(in oklab, var(--tinta) 30%, transparent); }
  .lineas li.act .pt { border-color: var(--tinta); animation: pulsa 1s ease-in-out infinite; }
  .lineas li.hecha .pt { background: var(--tinta); border-color: var(--tinta); color: var(--lima); }
  .lineas li.hecha .pt svg { animation: pop .3s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes pulsa { 50% { box-shadow: 0 0 0 6px color-mix(in oklab, var(--pistacho) 70%, transparent); } }
  @keyframes pop { from { transform: scale(.5); } to { transform: scale(1); } }

  /* Tienda lista */
  .tienda { background: var(--blanco); border-radius: 26px; overflow: hidden; box-shadow: 0 22px 40px -22px rgb(40 60 40 / .55); margin-top: 22px; }
  .tienda .ban { background: var(--pistacho); padding: 18px 16px; display: flex; gap: 12px; align-items: center; }
  .tienda .logo { width: 52px; height: 52px; border-radius: 999px; background: var(--blanco); display: grid; place-items: center; font-family: var(--f-d); font-weight: 800; font-size: 18px; flex-shrink: 0; }
  .tienda .nom { font-family: var(--f-d); font-weight: 800; font-size: 20px; line-height: 1.1; }
  .tienda .tip { font-size: 13px; }
  .tienda .secs { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 16px 4px; }
  .tienda .sec { border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; background: color-mix(in oklab, var(--lima) 55%, white); }
  .tienda .vacios { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 16px 16px; }
  .tienda .vacio { border: 2px dashed color-mix(in oklab, var(--tinta) 25%, transparent); border-radius: 16px; min-height: 84px; display: grid; place-items: center; text-align: center; font-size: 12px; font-weight: 700; color: var(--texto-2); padding: 8px; }
  .enlace { margin-top: 16px; background: var(--blanco); border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .enlace b { font-size: 15px; word-break: break-all; flex: 1; min-width: 0; }
  .copiar { min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--tinta); color: var(--lima); font-weight: 800; font-size: 14px; }
  .nota { font-size: 13px; color: var(--texto-2); margin-top: 8px; }
  .confeti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; contain: strict; z-index: 20; }
  .confeti i { position: absolute; top: 38%; left: 50%; width: 10px; height: 14px; border-radius: 3px; }

  /* Planes */
  .beneficios { list-style: none; display: grid; gap: 10px; margin-top: 18px; }
  .beneficios li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; font-weight: 600; }
  .beneficios .ck { width: 22px; height: 22px; border-radius: 999px; background: var(--tinta); color: var(--lima); display: grid; place-items: center; flex-shrink: 0; margin-top: 1px; }
  .planes { display: grid; gap: 12px; margin-top: 22px; }
  .plan { position: relative; text-align: left; background: var(--blanco); border-radius: 22px; border: 2px solid color-mix(in oklab, var(--tinta) 10%, transparent); padding: 14px 16px; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: start; transition: border-color .15s, background .15s, transform .12s; }
  .plan:active { transform: scale(.985); }
  .plan[aria-checked="true"] { border-color: var(--tinta); background: color-mix(in oklab, var(--lima) 40%, white); }
  .plan .rd { width: 24px; height: 24px; border-radius: 999px; border: 2px solid color-mix(in oklab, var(--tinta) 35%, transparent); margin-top: 3px; display: grid; place-items: center; }
  .plan[aria-checked="true"] .rd { border-color: var(--tinta); background: var(--tinta); }
  .plan[aria-checked="true"] .rd::after { content: ''; width: 8px; height: 8px; border-radius: 999px; background: var(--lima); }
  .plan h3 { font-size: 18px; font-weight: 800; }
  .plan ul { list-style: none; margin-top: 4px; font-size: 13.5px; color: var(--texto-2); display: grid; gap: 2px; }
  .plan > div { min-width: 0; }
  .plan .pr { white-space: nowrap; text-align: right; font-family: var(--f-d); font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1; }
  .plan .pr small { display: block; font-family: var(--f-b); font-size: 12px; font-weight: 600; color: var(--texto-2); margin-top: 2px; }
  .rec { position: absolute; top: -11px; left: 50px; background: var(--tinta); color: var(--lima); font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; }
  .porque { margin-top: 12px; font-size: 14px; background: color-mix(in oklab, var(--pistacho) 45%, white); border-radius: 16px; padding: 10px 14px; font-weight: 600; }
  .verdad { list-style: none; display: grid; gap: 4px; margin-top: 10px; font-size: 13.5px; color: var(--texto-2); }
  .verdad li { display: flex; gap: 8px; align-items: center; }
  .verdad svg { color: var(--verde-texto); flex-shrink: 0; }

  .pasos-sig { list-style: none; display: grid; gap: 10px; margin-top: 18px; }
  .pasos-sig li { display: flex; gap: 12px; align-items: center; background: var(--blanco); border-radius: 18px; padding: 12px 14px; font-weight: 700; font-size: 15px; }
  .pasos-sig .n { width: 30px; height: 30px; border-radius: 999px; background: var(--lima); display: grid; place-items: center; font-family: var(--f-d); font-weight: 800; flex-shrink: 0; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--tinta); color: var(--lima); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; display: none; z-index: 30; max-width: 90vw; }
  .toast.on { display: block; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ===== Estilo 3D (marca: v3d) ===== */
  .btn { box-shadow: 0 3px 0 rgb(255 255 255 / .2) inset, 0 -4px 0 rgb(0 0 0 / .3) inset, 0 7px 0 #000, 0 20px 26px -10px rgb(0 0 0 / .5); }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgb(255 255 255 / .2) inset, 0 2px 0 #000; }
  .btn.wa { box-shadow: 0 3px 0 rgb(255 255 255 / .45) inset, 0 -4px 0 rgb(0 0 0 / .14) inset, 0 7px 0 #138a45, 0 20px 26px -10px rgb(19 138 69 / .55); }
  .btn.claro { box-shadow: 0 3px 0 rgb(255 255 255 / .95) inset, 0 -3px 0 rgb(0 0 0 / .06) inset, 0 5px 0 rgb(40 70 20 / .14); }
  .btn[disabled] { box-shadow: none; }
  .lista-v .ic { box-shadow: inset 0 3px 0 rgb(255 255 255 / .6), inset 0 -4px 0 rgb(0 0 0 / .12), 0 4px 0 rgb(40 70 20 / .18); }
  .mini-tienda { box-shadow: 0 3px 0 rgb(255 255 255 / .95) inset, 0 7px 0 rgb(40 70 20 / .1), 0 28px 36px -20px rgb(30 60 20 / .6); }
  .mini-tienda .mt-prods i { box-shadow: inset 0 3px 0 rgb(255 255 255 / .5), inset 0 -4px 0 rgb(0 0 0 / .12); }

  /* ===== 3D intenso (marca: v3d2) ===== */
  .btn { box-shadow: 0 4px 0 rgb(255 255 255 / .2) inset, 0 -5px 0 rgb(0 0 0 / .3) inset, 0 9px 0 #000, 0 24px 28px -10px rgb(0 0 0 / .55); }
  .btn:active { transform: translateY(7px); box-shadow: 0 4px 0 rgb(255 255 255 / .2) inset, 0 2px 0 #000; }
  .btn.wa { box-shadow: 0 4px 0 rgb(255 255 255 / .45) inset, 0 -5px 0 rgb(0 0 0 / .14) inset, 0 9px 0 #138a45, 0 24px 28px -10px rgb(19 138 69 / .55); }
  .lista-v .ic { box-shadow: inset 0 4px 0 rgb(255 255 255 / .7), inset 0 -5px 0 rgb(0 0 0 / .14), 0 6px 0 rgb(40 70 20 / .2), 0 12px 12px -4px rgb(20 40 10 / .35); }
  .mini-tienda { box-shadow: 0 4px 0 rgb(255 255 255 / .95) inset, 0 10px 0 rgb(40 70 20 / .12), 0 32px 40px -20px rgb(30 60 20 / .65); }

  /* Cuenta real (marca: cta1) */
  .aviso-err { border-radius: 16px; padding: 12px 14px; font-size: 14px; font-weight: 700; color: #9a3412; background: color-mix(in oklab, var(--naranja) 16%, white); }
  .aviso-err[hidden] { display: none; }
  .campo input.codigo { font-family: var(--f-d); font-weight: 800; font-size: 28px; letter-spacing: .28em; text-align: center; padding: 0 8px; font-variant-numeric: tabular-nums; }
  .fila-links { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .link[disabled] { text-decoration: none; opacity: .7; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <div class="tope" id="tope">
    <button type="button" class="atras" id="atras" aria-label="Volver al paso anterior" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="barra" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8" id="barra"><i id="barra-i"></i></div>
    <span class="pct" id="pct" aria-live="polite">8%</span>
  </div>
  <main id="escena"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="vendor/supabase.js"></script>
<script src="vl-config.js"></script>
<script src="vl-datos.js"></script>
<script src="vl-registro.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var REDUCIDO = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';

  var TIPOS = [
    { id: 'ropa', n: 'Ropa', sec: ['Camisas', 'Vestidos', 'Pantalones'], d: '<path d="M13 5 4 10l4 7 4-2v19h16V15l4 2 4-7-9-5c-1 3-3.5 4.5-7 4.5S14 8 13 5z" transform="scale(.6)"/>' },
    { id: 'accesorios', n: 'Accesorios y joyería', sec: ['Aretes', 'Collares', 'Pulseras'], d: '<circle cx="8" cy="14" r="4"/><circle cx="16" cy="14" r="4"/><path d="M8 4v6M16 4v6"/>' },
    { id: 'comida', n: 'Comida y postres', sec: ['Postres', 'Almuerzos', 'Bebidas'], d: '<path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M9 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"/>' },
    { id: 'belleza', n: 'Belleza y cuidado', sec: ['Maquillaje', 'Cuidado de piel', 'Perfumes'], d: '<path d="M12 3c3 4 6 6 6 10a6 6 0 0 1-12 0c0-4 3-6 6-10Z"/>' },
