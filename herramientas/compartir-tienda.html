<!doctype html>
<!-- Fuente de logo/compartir-tienda.png (vista previa del enlace de una tienda en WhatsApp/Facebook, 1200x630).
     Para regenerarla: abrir esta página a 1200x630 y tomar la captura (ver ESTADO.md). -->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@600;700&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(520px 340px at 6% 0%, rgb(201 167 255 / .55), transparent 70%),
      radial-gradient(520px 360px at 100% 12%, rgb(148 213 250 / .55), transparent 70%),
      radial-gradient(560px 300px at 50% 112%, rgb(255 200 61 / .38), transparent 70%),
      #f6f1ea;
    font-family: 'Instrument Sans', sans-serif; color: #22104f;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  }
  .logo { width: 600px; height: auto; display: block; filter: drop-shadow(0 14px 18px rgb(60 16 120 / .16)); }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 54px; line-height: 1.05; letter-spacing: -.02em; text-align: center; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #7a2ff2, #e0179f 55%, #ff8a1a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pill { display: inline-flex; align-items: center; gap: 12px; padding: 12px 26px; border-radius: 999px; font-weight: 700; font-size: 25px; color: #0b2a40;
          background: linear-gradient(160deg, #d6f1ff, #94d5fa); box-shadow: 0 3px 0 rgb(255 255 255 / .7) inset, 0 6px 0 #4b9fd4, 0 18px 22px -12px rgb(16 90 140 / .45); }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: #ff8a1a; display: block; }
</style>
</head>
<body>
  <img class="logo" src="../logo/ventas-link-logo-estatico.svg" alt="Ventas Link" width="600" height="296">
  <h1>Mira esta tienda y pide <em>por WhatsApp</em></h1>
  <span class="pill">Elige tus productos <i></i> tu pedido llega armado</span>
</body>
</html>
