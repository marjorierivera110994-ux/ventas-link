<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Ventas Link — tu app de vendedor (demostración)</title>
<link rel="icon" href="logo/ventas-link-icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root { --pistacho: #a5dc5b; --lima: #e6ee4a; --naranja: #ff7a1a; --tinta: #131313; --beige: #f4ecdb; --blanco: #fff; --texto-2: #5a5648; --verde-texto: #2f6a10; --cielo: #d6f0ff;
          --f-d: 'Bricolage Grotesque', monospace; --f-b: 'Instrument Sans', monospace; --cab: 64px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: var(--f-b); color: var(--tinta); background: var(--beige); line-height: 1.45; overflow: hidden;
         background-image: radial-gradient(700px 320px at 100% -4%, color-mix(in oklab, var(--cielo) 80%, transparent), transparent 65%), radial-gradient(600px 300px at 0% 0%, color-mix(in oklab, var(--pistacho) 40%, transparent), transparent 62%); }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--f-d); letter-spacing: -.015em; }
  .oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  [hidden] { display: none !important; }

  /* Cabecera */
  .cab { position: fixed; top: 0; left: 0; right: 0; z-index: 20; height: var(--cab); padding: env(safe-area-inset-top) 16px 0; display: flex; align-items: center; justify-content: space-between; background: color-mix(in oklab, var(--beige) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .cab-in { width: 100%; max-width: 520px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .cab img { height: 36px; width: auto; display: block; }
  .iconos { display: flex; gap: 8px; }
  .ic-btn { width: 44px; height: 44px; border-radius: 999px; background: var(--blanco); display: grid; place-items: center; box-shadow: 0 6px 16px -10px rgb(40 60 40 / .6); position: relative; }
  .ic-btn svg { width: 22px; height: 22px; }
  .ic-btn .punto { position: absolute; top: 9px; right: 10px; width: 10px; height: 10px; border-radius: 999px; background: var(--naranja); border: 2px solid #fff; }
  .avatar { background: var(--pistacho); font-family: var(--f-d); font-weight: 800; }

  /* Paneles */
  .panel { position: fixed; top: var(--cab); left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .panel.marco { overflow: hidden; }
  .panel iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }
  .panel.marco { bottom: 96px; }
  .inicio { max-width: 520px; margin: 0 auto; padding: 8px 16px 130px; }
  .demo { display: inline-flex; background: var(--tinta); color: var(--lima); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; }
  .saludo { position: relative; margin-top: 12px; }
  .saludo small { font-weight: 600; color: var(--texto-2); font-size: 14px; }
  .saludo h1 { font-size: 30px; font-weight: 800; line-height: 1.05; }
  .tarj { background: var(--blanco); border-radius: 26px; padding: 16px; margin-top: 14px; box-shadow: 0 16px 30px -22px rgb(40 60 40 / .55); position: relative; }
  .tarj.oscura { background: var(--tinta); color: #fff; overflow: hidden; }
  .tarj.oscura small { color: var(--lima); font-weight: 700; font-size: 12px; }
  .tarj.oscura p { font-family: var(--f-d); font-weight: 700; font-size: 19px; line-height: 1.25; margin-top: 6px; padding-right: 64px; }
  .meta-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .meta-cab h2 { font-size: 17px; font-weight: 800; }
  .meta-cab b { font-family: var(--f-d); font-size: 22px; }
  .meta-cab span { font-size: 13px; color: var(--texto-2); font-weight: 600; }
  .barra { height: 14px; border-radius: 999px; background: color-mix(in oklab, var(--tinta) 10%, white); margin-top: 12px; overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--pistacho), var(--lima)); transition: width 1s cubic-bezier(.2, .8, .2, 1); }
  .hitos { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--texto-2); margin-top: 6px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  .stat { background: var(--blanco); border-radius: 22px; padding: 12px; box-shadow: 0 14px 26px -22px rgb(40 60 40 / .55); }
  .stat small { font-size: 12px; font-weight: 600; color: var(--texto-2); display: block; }
  .stat b { font-family: var(--f-d); font-size: 22px; font-weight: 800; display: block; margin-top: 2px; }
  .stat em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--verde-texto); }
  .acc-titulo { font-size: 17px; font-weight: 800; margin-top: 22px; }
  .acciones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
  .accion { min-height: 76px; border-radius: 22px; background: var(--blanco); padding: 12px; display: flex; align-items: center; gap: 12px; text-align: left; font-weight: 700; font-size: 14px; box-shadow: 0 14px 26px -22px rgb(40 60 40 / .55); transition: transform .12s ease; }
  .accion:active { transform: scale(.97); }
  .accion .chip { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 14px; display: grid; place-items: center; }
  .accion .chip svg { width: 24px; height: 24px; }
  .c1 { background: color-mix(in oklab, var(--pistacho) 55%, white); } .c2 { background: color-mix(in oklab, var(--naranja) 28%, white); } .c3 { background: color-mix(in oklab, var(--lima) 60%, white); } .c4 { background: var(--cielo); }
  .banner { display: flex; gap: 12px; align-items: center; border-radius: 26px; padding: 14px 16px; margin-top: 14px; text-align: left; width: 100%; background: linear-gradient(120deg, var(--naranja), #ffa83a); color: var(--tinta); position: relative; overflow: hidden; }
  .banner b { font-family: var(--f-d); font-size: 18px; display: block; }
  .banner span { font-size: 13px; font-weight: 600; }
  .banner.verde { background: linear-gradient(120deg, var(--pistacho), #c8ec6b); }
  .banner svg.flecha { width: 22px; height: 22px; margin-left: auto; flex: 0 0 22px; }

  /* Stickers (decoración) */
  .stk { position: absolute; width: 52px; height: 52px; pointer-events: none; filter: drop-shadow(0 6px 6px rgb(20 40 10 / .22)); animation: flota 4s ease-in-out infinite; }
  .stk.g { width: 64px; height: 64px; }
  @keyframes flota { 0%, 100% { transform: translateY(0) rotate(var(--r, -6deg)); } 50% { transform: translateY(-7px) rotate(calc(var(--r, -6deg) * -1)); } }

  /* Barra flotante */
  .nav { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; width: min(calc(100% - 24px), 480px); height: 68px; border-radius: 34px; padding: 8px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
         background: color-mix(in oklab, #fff 82%, transparent); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border: 1px solid rgb(255 255 255 / .8); box-shadow: 0 18px 40px -14px rgb(20 50 10 / .45), 0 2px 0 rgb(255 255 255 / .6) inset; }
  .nav button { border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--texto-2); min-height: 52px; transition: background .25s ease, color .25s ease, transform .12s ease; position: relative; }
  .nav button svg { width: 23px; height: 23px; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
  .nav button:active { transform: scale(.94); }
  .nav button[aria-current="page"] { background: var(--tinta); color: var(--lima); }
  .nav button[aria-current="page"] svg { transform: translateY(-1px) scale(1.12); }
  .nav .nuevo::after { content: ''; position: absolute; top: 6px; right: 14px; width: 9px; height: 9px; border-radius: 999px; background: var(--naranja); border: 2px solid #fff; }

  /* Hoja a pantalla completa */
  .hoja { position: fixed; inset: 0; z-index: 50; background: var(--beige); display: flex; flex-direction: column; transform: translateY(100%); transition: transform .35s cubic-bezier(.2, .8, .2, 1); visibility: hidden; }
  .hoja.on { transform: none; visibility: visible; }
  .hoja-cab { height: 60px; padding: env(safe-area-inset-top) 12px 0; display: flex; align-items: center; gap: 10px; background: var(--beige); }
  .hoja-cab h2 { font-size: 18px; font-weight: 800; }
  .hoja iframe { flex: 1; width: 100%; border: 0; background: transparent; }

  /* Pantalla de inicio con el logo en movimiento */
  .splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(600px 400px at 50% 40%, var(--cielo), var(--beige)); transition: opacity .5s ease, visibility .5s; }
  .splash.fuera { opacity: 0; visibility: hidden; }
  .splash img { width: min(62vw, 280px); height: auto; display: block; }
  .splash p { position: absolute; bottom: 12%; font-weight: 600; color: var(--texto-2); font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--tinta); color: var(--lima); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; display: none; z-index: 60; max-width: 90vw; text-align: center; }
  .toast.on { display: block; }
  @media (prefers-reduced-motion: reduce) { .stk { animation: none; } .barra i, .hoja, .splash { transition: none; } }

  /* ===== Estilo 3D (marca: v3d) ===== */
  .t3d { position: absolute; top: -22px; left: 50%; margin-left: -25px; width: 50px; height: 50px; border-radius: 18px; display: grid; place-items: center; color: #fff;
         background: linear-gradient(160deg, var(--a), var(--b)); --y: 0px; --s: 1;
         box-shadow: inset 0 3px 0 rgb(255 255 255 / .6), inset 0 -5px 0 rgb(0 0 0 / .16), 0 7px 0 var(--sh), 0 16px 16px -4px rgb(20 40 10 / .5);
         animation: bob3d 3.4s ease-in-out infinite; transition: box-shadow .2s ease; }
  .t3d::before { content: ''; position: absolute; left: 4px; right: 4px; top: 3px; height: 46%; border-radius: 15px 15px 50% 50% / 15px 15px 40% 40%; background: linear-gradient(rgb(255 255 255 / .55), rgb(255 255 255 / 0)); pointer-events: none; }
  .t3d svg { position: relative; width: 24px; height: 24px; stroke-width: 2.6; filter: drop-shadow(0 2px 0 rgb(0 0 0 / .28)); }
  .t3d.verde { --a: #b8ee62; --b: #4fae12; --sh: #2f7d0f; } .t3d.naranja { --a: #ffb83a; --b: #ff6a00; --sh: #b34700; }
  .t3d.lima { --a: #f7fa86; --b: #d6de1c; --sh: #8a9100; color: #131313; } .t3d.lima svg { filter: drop-shadow(0 2px 0 rgb(255 255 255 / .5)); }
  .t3d.cielo { --a: #86d4ff; --b: #2f9bea; --sh: #1b6aa8; } .t3d.tinta { --a: #4a4a4a; --b: #131313; --sh: #000; color: #e6ee4a; }
  @keyframes bob3d { 0%, 100% { transform: translateY(var(--y)) scale(var(--s)); } 50% { transform: translateY(calc(var(--y) - 4px)) scale(var(--s)); } }
  .nav { overflow: visible; height: 74px; padding: 0 6px;
         background: linear-gradient(180deg, rgb(255 255 255 / .92), rgb(244 250 238 / .86));
         box-shadow: 0 26px 40px -14px rgb(20 50 10 / .55), 0 4px 0 rgb(255 255 255 / .9) inset, 0 -4px 0 rgb(0 0 0 / .05) inset, 0 6px 0 rgb(40 70 20 / .12); }
  .nav button { background: transparent !important; justify-content: flex-end; height: 100%; min-height: 0; padding: 0 0 8px; color: var(--texto-2) !important; font-size: 11px; font-weight: 700; }
  .nav button:active { transform: none; }
  .nav button:active .t3d { box-shadow: inset 0 3px 0 rgb(255 255 255 / .5), inset 0 -3px 0 rgb(0 0 0 / .16), 0 2px 0 var(--sh), 0 8px 10px -4px rgb(20 40 10 / .5); transform: translateY(5px); }
  .nav button[aria-current="page"], .nav button.act { color: var(--tinta) !important; }
  .nav button[aria-current="page"] .t3d, .nav button.act .t3d { --y: -9px; --s: 1.14; box-shadow: inset 0 3px 0 rgb(255 255 255 / .6), inset 0 -5px 0 rgb(0 0 0 / .16), 0 8px 0 var(--sh), 0 22px 22px -4px rgb(20 40 10 / .6), 0 0 0 5px rgb(255 255 255 / .75); }
  .nav button svg { transform: none !important; }
  .nav button:nth-child(2) .t3d { animation-delay: .35s; } .nav button:nth-child(3) .t3d { animation-delay: .7s; } .nav button:nth-child(4) .t3d { animation-delay: 1.05s; } .nav button:nth-child(5) .t3d { animation-delay: 1.4s; }
  .nav .cuenta-n { top: -26px; right: 8px; z-index: 2; }
  .nav .nuevo::after { top: -22px; right: 10px; z-index: 2; }
  @media (prefers-reduced-motion: reduce) { .t3d { animation: none; } }

  .panel.marco { bottom: 112px; } .inicio { padding-bottom: 150px; }
  body::before, body::after { content: ''; position: fixed; z-index: -1; border-radius: 50%; pointer-events: none; }
  body::before { width: 260px; height: 260px; right: -90px; top: 120px; background: radial-gradient(circle at 32% 28%, #fff 0, #ffc46b 22%, #ff7a1a 70%, #d95a00 100%); opacity: .28; }
  body::after { width: 220px; height: 220px; left: -90px; top: 520px; background: radial-gradient(circle at 32% 28%, #fff 0, #c9f08a 22%, #6cc424 70%, #3f9a10 100%); opacity: .28; }
  .tarj, .stat, .accion { border: 1px solid rgb(255 255 255 / .95); box-shadow: 0 3px 0 rgb(255 255 255 / .95) inset, 0 -4px 0 rgb(0 0 0 / .05) inset, 0 6px 0 rgb(40 70 20 / .09), 0 24px 30px -18px rgb(30 60 20 / .5); }
  .tarj.oscura { background: linear-gradient(160deg, #343434, #131313); border-color: #3a3a3a; box-shadow: 0 3px 0 rgb(255 255 255 / .14) inset, 0 -5px 0 rgb(0 0 0 / .35) inset, 0 7px 0 #000, 0 24px 30px -14px rgb(0 0 0 / .6); }
  .accion { transition: transform .1s ease, box-shadow .1s ease; } .accion:active { transform: translateY(4px); box-shadow: 0 3px 0 rgb(255 255 255 / .95) inset, 0 1px 0 rgb(40 70 20 / .09), 0 8px 12px -8px rgb(30 60 20 / .5); }
  .accion .chip { border-radius: 16px; box-shadow: inset 0 3px 0 rgb(255 255 255 / .6), inset 0 -4px 0 rgb(0 0 0 / .14), 0 5px 0 rgb(0 0 0 / .18), 0 10px 10px -4px rgb(20 40 10 / .4); }
  .accion .c1 { background: linear-gradient(160deg, #b8ee62, #4fae12); } .accion .c2 { background: linear-gradient(160deg, #ffb83a, #ff6a00); } .accion .c3 { background: linear-gradient(160deg, #f7fa86, #d6de1c); } .accion .c4 { background: linear-gradient(160deg, #86d4ff, #2f9bea); }
  .accion .c1 svg, .accion .c2 svg, .accion .c4 svg { stroke: #fff; stroke-width: 2.8; filter: drop-shadow(0 2px 0 rgb(0 0 0 / .28)); }
  .banner { box-shadow: 0 3px 0 rgb(255 255 255 / .4) inset, 0 -4px 0 rgb(0 0 0 / .12) inset, 0 7px 0 #c25000, 0 22px 26px -12px rgb(180 80 0 / .6); transition: transform .1s ease, box-shadow .1s ease; }
  .banner.verde { box-shadow: 0 3px 0 rgb(255 255 255 / .5) inset, 0 -4px 0 rgb(0 0 0 / .1) inset, 0 7px 0 #5a9a14, 0 22px 26px -12px rgb(60 120 10 / .6); }
  .banner:active { transform: translateY(5px); box-shadow: 0 3px 0 rgb(255 255 255 / .4) inset, 0 2px 0 #c25000; } .banner.verde:active { box-shadow: 0 3px 0 rgb(255 255 255 / .5) inset, 0 2px 0 #5a9a14; }
  .ic-btn { box-shadow: 0 3px 0 rgb(255 255 255 / .95) inset, 0 -3px 0 rgb(0 0 0 / .06) inset, 0 4px 0 rgb(40 70 20 / .12), 0 12px 14px -8px rgb(30 60 20 / .5); }
  .barra { box-shadow: inset 0 3px 6px rgb(0 0 0 / .18); height: 16px; } .barra i { box-shadow: inset 0 3px 0 rgb(255 255 255 / .55), inset 0 -3px 0 rgb(0 0 0 / .12); }

  /* ===== 3D intenso (marca: v3d2) ===== */
  .t3d { top: -32px; margin-left: -30px; width: 60px; height: 60px; border-radius: 22px;
         box-shadow: inset 0 4px 0 rgb(255 255 255 / .7), inset 0 -7px 0 rgb(0 0 0 / .2), 0 10px 0 var(--sh), 0 24px 22px -4px rgb(20 40 10 / .6);
         animation-duration: 3s; }
  .t3d::before { left: 5px; right: 5px; top: 4px; height: 48%; border-radius: 18px 18px 50% 50% / 18px 18px 40% 40%; background: linear-gradient(rgb(255 255 255 / .7), rgb(255 255 255 / 0)); }
  .t3d::after { content: ''; position: absolute; width: 9px; height: 9px; border-radius: 50%; right: 9px; top: 9px; background: rgb(255 255 255 / .85); filter: blur(.5px); }
  .t3d svg { width: 29px; height: 29px; stroke-width: 2.8; filter: drop-shadow(0 3px 0 rgb(0 0 0 / .3)); }
  @keyframes bob3d { 0%, 100% { transform: translateY(var(--y)) scale(var(--s)) rotate(-1.5deg); } 50% { transform: translateY(calc(var(--y) - 7px)) scale(var(--s)) rotate(1.5deg); } }
  .nav { height: 80px; border-radius: 40px; box-shadow: 0 30px 46px -14px rgb(20 50 10 / .6), 0 5px 0 rgb(255 255 255 / .95) inset, 0 -5px 0 rgb(0 0 0 / .06) inset, 0 9px 0 rgb(40 70 20 / .16); }
  .nav button { padding-bottom: 9px; font-size: 11.5px; }
  .nav button:active .t3d { transform: translateY(7px) scale(.97); box-shadow: inset 0 4px 0 rgb(255 255 255 / .55), inset 0 -4px 0 rgb(0 0 0 / .2), 0 3px 0 var(--sh), 0 8px 10px -4px rgb(20 40 10 / .5); }
  .nav button[aria-current="page"] .t3d, .nav button.act .t3d, .nav .ped:not(.vacio-c) .t3d { --y: -14px; --s: 1.18;
         box-shadow: inset 0 4px 0 rgb(255 255 255 / .7), inset 0 -7px 0 rgb(0 0 0 / .2), 0 11px 0 var(--sh), 0 32px 28px -4px rgb(20 40 10 / .65), 0 0 0 6px rgb(255 255 255 / .85), 0 0 30px 8px rgb(255 255 255 / .6); }
  .nav .cuenta-n { top: -38px; right: 4px; min-width: 24px; height: 24px; font-size: 12px; }
  .nav .nuevo::after { top: -36px; right: 8px; width: 12px; height: 12px; }
  .panel.marco { bottom: 128px; } .inicio { padding-bottom: 170px; } .app { padding-bottom: 170px; }
  .tarj, .stat, .accion, .prod { box-shadow: 0 4px 0 rgb(255 255 255 / .95) inset, 0 -5px 0 rgb(0 0 0 / .06) inset, 0 10px 0 rgb(40 70 20 / .13), 0 30px 36px -18px rgb(30 60 20 / .55); }
  .tarj.oscura { box-shadow: 0 4px 0 rgb(255 255 255 / .16) inset, 0 -6px 0 rgb(0 0 0 / .4) inset, 0 10px 0 #000, 0 30px 36px -14px rgb(0 0 0 / .65); }
  .accion .chip { box-shadow: inset 0 4px 0 rgb(255 255 255 / .7), inset 0 -6px 0 rgb(0 0 0 / .16), 0 7px 0 rgb(0 0 0 / .22), 0 14px 12px -4px rgb(20 40 10 / .45); }
  .mas { box-shadow: inset 0 4px 0 rgb(255 255 255 / .7), inset 0 -5px 0 rgb(0 0 0 / .16), 0 7px 0 #8a9100, 0 14px 12px -4px rgb(20 40 10 / .45); }
  .banner { box-shadow: 0 4px 0 rgb(255 255 255 / .45) inset, 0 -5px 0 rgb(0 0 0 / .14) inset, 0 10px 0 #c25000, 0 28px 30px -12px rgb(180 80 0 / .65); }
  .banner.verde { box-shadow: 0 4px 0 rgb(255 255 255 / .55) inset, 0 -5px 0 rgb(0 0 0 / .12) inset, 0 10px 0 #5a9a14, 0 28px 30px -12px rgb(60 120 10 / .65); }
  body::before { opacity: .38; } body::after { opacity: .38; }

  /* ===== Ajustes del usuario (marca: v3d3) ===== */
  .tarj.oscura, .frase-dia { background: linear-gradient(160deg, #d3f0ff, #8fd3fa) !important; color: #0b2a40 !important; border-color: #eaf8ff !important;
    box-shadow: 0 4px 0 rgb(255 255 255 / .85) inset, 0 -6px 0 rgb(20 110 180 / .18) inset, 0 10px 0 #4aa8e0, 0 28px 34px -14px rgb(30 110 180 / .55) !important; }
  .tarj.oscura small, .frase-dia small { color: #07517f !important; font-weight: 800; }
  .tarj.oscura p, .frase-dia p { color: #0b2a40 !important; }

  .acciones { gap: 12px; }
  .accion { min-width: 0; padding: 12px 10px; gap: 10px; font-size: 13.5px; line-height: 1.2; }
  .accion .chip { width: 42px; height: 42px; flex: 0 0 42px; }
  .accion .tx { min-width: 0; flex: 1; overflow-wrap: break-word; hyphens: auto; }
  .banner > div:first-child { flex: 1; min-width: 0; padding-right: 66px; }
  .banner b { font-size: 17px; line-height: 1.15; }
  .banner span { line-height: 1.25; display: block; margin-top: 2px; }
</style>
</head>
<body>

<!-- Stickers: dibujos propios, sin emojis -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var FRASES = ['Una foto clara vende más que mil explicaciones.', 'Responder rápido es la mejor publicidad.', 'No vendes productos: resuelves problemas y alegras días.', 'Cada cliente feliz te trae otro. Cuida el trato.', 'Publica hoy, aunque no salga perfecto.', 'La constancia le gana al talento que no se mueve.', 'Comparte tu tienda con una persona más hoy.', 'Pequeños pasos cada día construyen un gran negocio.', 'Tu historia también vende: cuenta por qué empezaste.', 'Si hoy no vendiste, hoy aprendiste. Sigue.', 'Confía en ti: ya diste el paso que muchos solo imaginan.', 'Mide lo que haces: lo que se mide, mejora.'];
  var ult = -1; try { ult = parseInt(localStorage.getItem('vl-ultima-frase'), 10); } catch (e) { ult = -1; }
  var i; do { i = Math.floor(Math.random() * FRASES.length); } while (i === ult);
  try { localStorage.setItem('vl-ultima-frase', String(i)); } catch (e) { /* sin almacenamiento */ }
  $('frase').textContent = FRASES[i];
  var h = new Date().getHours(); $('hora').textContent = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';

  function toast(m) { var x = $('toast'); x.textContent = m; x.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { x.classList.remove('on'); }, 2400); }

  var tabs = ['inicio', 'productos', 'pedidos', 'compartir', 'plan'];
  function ir(t) {
    tabs.forEach(function (k) { var p = $('p-' + k); p.hidden = k !== t; });
    [].slice.call($('nav').querySelectorAll('button')).forEach(function (b) { if (b.dataset.t === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    var f = $('p-' + t).querySelector('iframe'); if (f && !f.src) f.src = f.dataset.src;
    if (t === 'inicio') animarBarra();
    if (t === 'pedidos') $('nav').querySelector('[data-t="pedidos"]').classList.remove('nuevo');
  }
  [].slice.call($('nav').querySelectorAll('button')).forEach(function (b) { b.addEventListener('click', function () { ir(b.dataset.t); }); });
  [].slice.call(document.querySelectorAll('[data-ir]')).forEach(function (b) { b.addEventListener('click', function () { ir(b.dataset.ir); }); });

  var hoja = $('hoja'), hf = $('hoja-f');
  function abrirHoja(src, titulo) { $('hoja-t').textContent = titulo; hf.src = src; hoja.classList.add('on'); $('volver').focus(); }
  function cerrarHoja() { hoja.classList.remove('on'); setTimeout(function () { hf.removeAttribute('src'); }, 400); }
  [].slice.call(document.querySelectorAll('[data-hoja]')).forEach(function (b) { b.addEventListener('click', function () { var p = b.dataset.hoja.split('|'); abrirHoja(p[0], p[1]); }); });
  $('volver').addEventListener('click', cerrarHoja);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && hoja.classList.contains('on')) cerrarHoja(); });
  $('campana').addEventListener('click', function () { ir('pedidos'); });
  $('perfil').addEventListener('click', function () { abrirHoja('personalizar-demo.html', 'Mi tienda y mi perfil'); });

  function animarBarra() { var b = $('barra'); b.style.width = '0'; requestAnimationFrame(function () { requestAnimationFrame(function () { b.style.width = '92%'; }); }); }

  var splash = $('splash'), quieto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function quitarSplash() { splash.classList.add('fuera'); animarBarra(); }
  splash.addEventListener('click', quitarSplash);
  setTimeout(quitarSplash, quieto ? 600 : 2800);
  var hh = (location.hash || '').slice(1); if (tabs.indexOf(hh) > 0) { ir(hh); } if (hh) { quitarSplash(); }
  window.__app = { ir: ir, abrirHoja: abrirHoja, cerrarHoja: cerrarHoja, quitarSplash: quitarSplash };
})();
</script>
